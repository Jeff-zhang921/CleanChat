name: Backend Keepalive

on:
  push:
    branches:
      - main
      - master
  schedule:
    # UTC: run at minute 7, 22, 37, 52 of every hour to avoid top-of-hour queue spikes.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Starting Keepalive
        run: echo "Starting Keepalive..."

      - name: Validate keepalive configuration
        env:
          BACKEND_KEEPALIVE_URL: ${{ secrets.BACKEND_KEEPALIVE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_KEEPALIVE_URL:-}" ]; then
            echo "::error::Error: BACKEND_KEEPALIVE_URL is not set in GitHub Secrets!"
            exit 1
          fi

      - name: Ping keepalive endpoint
        env:
          BACKEND_KEEPALIVE_URL: ${{ secrets.BACKEND_KEEPALIVE_URL }}
          BACKEND_OPS_TOKEN: ${{ secrets.BACKEND_OPS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${BACKEND_OPS_TOKEN:-}" ]; then
            curl --fail --silent --show-error --max-time 20 \
              -H "x-ops-token: ${BACKEND_OPS_TOKEN}" \
              "${BACKEND_KEEPALIVE_URL}"
          else
            curl --fail --silent --show-error --max-time 20 \
              "${BACKEND_KEEPALIVE_URL}"
          fi
